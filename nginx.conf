server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ───────────────────────────────────────────────────
    # Baseline hardening. CSP allows 'self' + inline styles (Vite injects
    # critical CSS) + the tsparticles canvas. Tighten nonce/strict-dynamic later.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

    # ── Gzip ───────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;

    # SPA fallback for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached — otherwise stale HTML lingers after deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        expires off;
    }

    # Proxy /api to the Node Gemini-proxy service (see docker-compose.yml).
    # nginx terminates HTTP; the proxy talks to Gemini over HTTPS.
    location /api/ {
        proxy_pass http://proxy:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # First hop = real client; the proxy uses this for per-IP rate limiting.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering so SSE chunks flush immediately.
        proxy_buffering off;
        proxy_cache off;

        # Allow generous timeouts for long generations (Celtic Cross, chat).
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_send_timeout 30s;

        # Cap body size to match the proxy's MAX_BODY_BYTES (64 KiB).
        client_max_body_size 96k;
    }

    # Hashed assets — safe to cache aggressively.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }
}
