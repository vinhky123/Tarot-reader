server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback for React Router / client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api to the Node Gemini-proxy service (see docker-compose.yml).
    # nginx terminates HTTP; the proxy talks to Gemini over HTTPS.
    location /api/ {
        proxy_pass http://proxy:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # First hop = real client; the proxy uses this for per-IP rate limiting.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow generous timeouts for long generations (Celtic Cross, chat).
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_send_timeout 30s;

        # Cap body size to match the proxy's MAX_BODY_BYTES (64 KiB).
        client_max_body_size 96k;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }
}
